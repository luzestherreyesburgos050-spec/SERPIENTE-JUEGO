<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Juego Web</title>
    <style>
        body {
            background-color: #1e1e24;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 4px solid #4caf50;
            display: block;
            margin: 20px auto;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Juego de la Serpiente 🐍</h1>
    <p>Usa las <b>flechas del teclado</b> para moverte.</p>
    <div class="score">Puntos: <span id="scoreBoard">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scale = 20;
        let snake = [{x: 200, y: 200}];
        let dx = scale;
        let dy = 0;
        let food = {x: 100, y: 100};
        let score = 0;

        // El juego corre/actualiza cada 100 milisegundos
        let gameInterval = setInterval(main, 100);

        function main() {
            if (checkGameOver()) {
                alert("¡Perdiste! Tu puntuación fue de: " + score + " puntos.");
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4caf50"; // Color verde para la serpiente
            snake.forEach(part => ctx.fillRect(part.x, part.y, scale - 2, scale - 2));
        }

        function drawFood() {
            ctx.fillStyle = "#ff4d4d"; // Color rojo para la manzana
            ctx.fillRect(food.x, food.y, scale - 2, scale - 2);
        }

        function moveSnake() {
            // AQUÍ ESTABA EL ERROR: Ahora sí toma la cabeza correctamente usando [0]
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Si la cabeza pasa por encima de la comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("scoreBoard").innerText = score;
                generateFood();
            } else {
                snake.pop(); // Si no come, se corta la cola para simular movimiento
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / scale)) * scale;
            food.y = Math.floor(Math.random() * (canvas.height / scale)) * scale;
            
            // Evitar que la comida aparezca encima de la serpiente
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function checkGameOver() {
            const head = snake[0];
            
            // Chocar con las paredes
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) return true;
            
            // Chocar con su propio cuerpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [{x: 200, y: 200}];
            dx = scale;
            dy = 0;
            score = 0;
            document.getElementById("scoreBoard").innerText = score;
            generateFood();
        }

        // Control del teclado
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -scale; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = scale; }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -scale; dy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { dx = scale; dy = 0; }
        });
    </script>
</body>
</html>
